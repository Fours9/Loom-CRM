services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: loom
      POSTGRES_PASSWORD: loom
      POSTGRES_DB: loom_crm
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB']
      interval: 5s
      timeout: 3s
      retries: 10

  migrate:
    build:
      context: .
      dockerfile: docker/api.Dockerfile
    environment:
      DATABASE_URL: postgres://loom:loom@postgres:5432/loom_crm
      NODE_ENV: production
    command: ['pnpm', '--filter', '@loom/api', 'migration:run']
    depends_on:
      postgres:
        condition: service_healthy

  api:
    build:
      context: .
      dockerfile: docker/api.Dockerfile
    environment:
      DATABASE_URL: postgres://loom:loom@postgres:5432/loom_crm
      NODE_ENV: production
      PORT: '3000'
      JWT_SECRET: change-me-in-production-loom-crm-dev-secret
    ports:
      - '3000:3000'
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test:
        [
          'CMD-SHELL',
          'wget -qO- http://127.0.0.1:3000/api/v1/health/ready || exit 1',
        ]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 15s

  web:
    build:
      context: .
      dockerfile: docker/web.Dockerfile
    ports:
      - '8080:80'
    depends_on:
      api:
        condition: service_healthy

volumes:
  postgres_data:
